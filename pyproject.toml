[build-system]
requires = ["setuptools>=65.0", "wheel", "pydantic", "paho-mqtt", "certifi", "requests", "typing_extensions"]
build-backend = "setuptools.build_meta"

[project]
name = "iot2mqtt"
dynamic = ["version"]
description = "Simplifying IoT Solutions with MQTT Integration"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Serge LASSABE", email = "dev@lassabe.org"},
]
keywords = ["IoT", "MQTT", "integration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "paho-mqtt>=2.0.0",  # MQTT v5 support for User Properties
    "certifi",
    "requests",
    "pydantic",
    "typing_extensions;python_version<'3.10'",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "pylint>=2.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
]

[tool.setuptools.dynamic]
version = {attr = "iot2mqtt.__version__"}

[project.urls]
Homepage = "https://github.com/slassabe/iot2mqtt"
Repository = "https://github.com/slassabe/iot2mqtt.git"
Documentation = "https://github.com/slassabe/iot2mqtt/wiki"

[project.scripts]
cli_iot2mqtt = "iot2mqtt.cli:main"

[tool.setuptools]
packages = ["iot2mqtt", "iot2mqtt.core", "iot2mqtt.devices"]

[tool.setuptools.package-data]
iot2mqtt = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pylint]
max-line-length = 100
disable = ["C0111"]
